<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Column Responsive Layout</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h1 class="text-center mb-4">Multi-Column Responsive Layout</h1>

  <div class="row">
    
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-primary text-white p-3">
      Column 1
    </div>

    
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-success text-white p-3">
      Column 2
    </div>

    <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-warning text-dark p-3">
      Column 3
    </div>

    
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-danger text-white p-3">
      Column 4
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
