<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>String Validation and Manipulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: 250px;
        }

        .error {
            color: red;
        }

        .result {
            margin-top: 20px;
            color: green;
        }
    </style>
</head>
<body>

    <h2>User Form</h2>

    <form onsubmit="validateForm(event)">
        <label>Name:</label><br>
        <input type="text" id="name"><br>

        <label>Email:</label><br>
        <input type="text" id="email"><br>

        <label>Age:</label><br>
        <input type="text" id="age"><br>

        <button type="submit">Submit</button>
    </form>

    <p id="errorMsg" class="error"></p>
    <div id="output" class="result"></div>

    <script>
        function validateForm(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let age = document.getElementById("age").value.trim();

            let error = document.getElementById("errorMsg");
            let output = document.getElementById("output");

            error.innerHTML = "";
            output.innerHTML = "";

            // Name validation
            if (name.length < 3) {
                error.innerHTML = "Name must have at least 3 characters.";
                return;
            }

            // Format name (first letter uppercase)
            name = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();

            // Email validation
            if (!email.includes("@")) {
                error.innerHTML = "Invalid email address.";
                return;
            }

            // Format email
            email = email.toLowerCase();

            // Age validation and type conversion
            age = Number(age);

            if (isNaN(age) || age <= 0 || age >100) {
                error.innerHTML = "Age must be a valid number between 1 and 100.";
                return;
            }

            // Display formatted result
            output.innerHTML =
                "Name: " + name + "<br>" +
                "Email: " + email + "<br>" +
                "Age: " + age;
        }
    </script>

</body>
</html>
